theme: jekyll-theme-cayman
title: 日本留学 AI 新闻雷达
description: 面向日本留学内容创作者的 AI 每日新闻摘要
baseurl: "/horizon-japan-study-radar"
url: "https://maxsonnseityou.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
